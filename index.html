<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro Kanban</title>
    <link rel="stylesheet" href="src/style/style.css" />
  </head>
  <body>
    <!-- TELA INICIAL -->
    <div id="telaInicial" class="tela-inicial">
      <div class="modal-inicial">
        <h1 class="titulo-inicial">Bem-vindo ao Kanban</h1>
        <p class="subtitulo-inicial">Como você deseja usar este quadro?</p>

        <div class="opcoes">
          <button
            class="btn-opcao btn-professor"
            onclick="escolherPerfil('professor')"
          >
            <span class="icone">👨‍🏫</span>
            <span class="texto">Sou Professor</span>
          </button>
          <button class="btn-opcao btn-aluno" onclick="escolherPerfil('aluno')">
            <span class="icone">👨‍🎓</span>
            <span class="texto">Sou Aluno</span>
          </button>
        </div>
      </div>
    </div>

    <!-- QUADRO KANBAN -->
    <div id="quadroKanban" class="quadro-kanban" style="display: none">
      <div class="header-kanban">
        <h1>Olá, bem vindo ao seu quadro Kanban</h1>
        <button class="btn-trocar" onclick="trocarPerfil()">
          Trocar Perfil
        </button>
      </div>

      <main>
        <div class="container">
          <div class="coluna" id="todo">
            <h2>To Do</h2>
          </div>
          <div class="coluna" id="inProgress">
            <h2>In Progress</h2>
          </div>
          <div class="coluna" id="done">
            <h2>Done</h2>
          </div>
        </div>
      </main>
    </div>

    <script>
      const initialBoardState = {
        card1: "todo",
        card2: "todo",
        card3: "inProgress",
        card4: "done",
      };

      function escolherPerfil(perfil) {
        localStorage.setItem("perfil", perfil);
        mostrarKanban();
      }

      function trocarPerfil() {
        localStorage.removeItem("perfil");
        voltarTelaInicial();
      }

      function mostrarKanban() {
        document.getElementById("telaInicial").style.display = "none";
        document.getElementById("quadroKanban").style.display = "block";
        const perfil = localStorage.getItem("perfil") || "aluno";
        atualizarHeader(perfil);
        renderizarQuadro(perfil);
      }

      function voltarTelaInicial() {
        document.getElementById("telaInicial").style.display = "flex";
        document.getElementById("quadroKanban").style.display = "none";
      }

      function obterEstadoQuadro() {
        const estadoSalvo = localStorage.getItem("quadroKanbanEstado");
        return estadoSalvo ? JSON.parse(estadoSalvo) : initialBoardState;
      }

      function salvarEstadoQuadro(estado) {
        localStorage.setItem("quadroKanbanEstado", JSON.stringify(estado));
      }

      function atualizarHeader(perfil) {
        const header = document.querySelector(".header-kanban h1");
        if (perfil === "aluno") {
          header.textContent = "Aluno: mova as atividades entre os quadros.";
        } else {
          header.textContent = "Professor: visualizando as atividades movidas pelo aluno.";
        }
      }

      function criarCard(id, texto, perfil) {
        const card = document.createElement("div");
        card.className = "card";
        card.id = id;
        card.textContent = texto;
        card.draggable = perfil === "aluno";
        if (perfil === "aluno") {
          card.addEventListener("dragstart", aoIniciarArraste);
        }
        return card;
      }

      function renderizarQuadro(perfil) {
        const colunas = {
          todo: document.getElementById("todo"),
          inProgress: document.getElementById("inProgress"),
          done: document.getElementById("done"),
        };

        Object.values(colunas).forEach((coluna) => {
          coluna.querySelectorAll(".card").forEach((card) => card.remove());
          coluna.classList.remove("drag-over");
          coluna.removeEventListener("dragover", permitirArrastar);
          coluna.removeEventListener("drop", soltarCard);
          coluna.removeEventListener("dragleave", removerDragOver);
          if (perfil === "aluno") {
            coluna.addEventListener("dragover", permitirArrastar);
            coluna.addEventListener("drop", soltarCard);
            coluna.addEventListener("dragleave", removerDragOver);
          }
        });

        const estado = obterEstadoQuadro();
        const cartas = [
          { id: "card1", texto: "Tarefa 1" },
          { id: "card2", texto: "Tarefa 2" },
          { id: "card3", texto: "Tarefa 3" },
          { id: "card4", texto: "Tarefa 4" },
        ];

        cartas.forEach(({ id, texto }) => {
          const colunaAlvo = estado[id] || initialBoardState[id];
          const card = criarCard(id, texto, perfil);
          colunas[colunaAlvo].appendChild(card);
        });
      }

      function aoIniciarArraste(event) {
        event.dataTransfer.setData("text/plain", event.target.id);
      }

      function permitirArrastar(event) {
        event.preventDefault();
        event.currentTarget.classList.add("drag-over");
      }

      function removerDragOver(event) {
        event.currentTarget.classList.remove("drag-over");
      }

      function soltarCard(event) {
        event.preventDefault();
        const cardId = event.dataTransfer.getData("text/plain");
        const colunaDestino = event.currentTarget.id;
        if (!cardId || !colunaDestino) {
          return;
        }
        const estado = obterEstadoQuadro();
        estado[cardId] = colunaDestino;
        salvarEstadoQuadro(estado);
        renderizarQuadro(localStorage.getItem("perfil"));
      }

      window.addEventListener("DOMContentLoaded", function () {
        const perfilSalvo = localStorage.getItem("perfil");
        if (perfilSalvo) {
          mostrarKanban();
        }
      });
    </script>
  </body>
</html>
